<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <meta name="description" content="Quiz de révision entre étudiants — Linux : le noyau.">
  <meta name="theme-color" content="#0b0d17">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="style.css">
  <script>
    try { const t = localStorage.getItem("hus-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#" id="homeLink">

      <span>Help Us <b>Student</b></span>

    <div class="top-actions">

      <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    </div>
  </header>

    Fait par des étudiants, pour des étudiants · <span id="year"></span>
  </footer>
